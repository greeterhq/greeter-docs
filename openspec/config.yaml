schema: spec-driven

context: |
  greeter-docs: the live documentation site for greeterHQ, built as a
  hexagonal Ruby application and published to GitHub Pages
  (greeterhq.github.io/greeter-docs).
  - Domain (lib/greeter_docs/domain/, pure Ruby, no I/O): Repo, Requirement,
    Scenario, Result, LedgerView, ApiDescription, Adr, Diagram, DocsModel,
    CoverageRule. CoverageRule#violations(model) returns every requirement on
    main with no passing scenario, after applying that repo's
    openspec/requirement-tags.yml (tag-mapped requirements are covered by the
    prod ledger, not the repo trace).
  - Ports (lib/greeter_docs/ports/): SpecSource, TraceSource, LedgerSource,
    ApiSource, AdrSource, DiagramSource, ContractSource, SloSource, Publisher.
  - Adapters (lib/greeter_docs/adapters/): GitSpecSource (parses
    `### Requirement:` / `#### Scenario:` headings in openspec/specs/**/spec.md
    with the shared slug rule, so slugs match every repo's trace check; shallow
    clones under tmp/repos/<repo>, greeter-docs from its own checkout),
    ArtifactTraceSource (tmp/traces/<repo>/repo-trace.json,
    greeterhq.repo-trace.v1), RawLedgerSource (greeterhq.ledger.v2 from the
    ledger-prod and ledger-stage branches through an injected fetcher),
    FileApiSource, FileAdrSource, FileDiagramSource, NullContractSource,
    NullSloSource, ErbHtmlPublisher.
  - bin/fetch-sources clones the producer repos (depth 1, main) and downloads
    each one's latest successful main-branch ci.yml `repo-trace` artifact;
    bin/build-docs is the composition root and writes _site/.
  - Pages: index, per-repo requirement -> scenario -> latest result pages,
    channel x requirement grid from the ledgers (passed / failed / n/a / not yet
    recorded), API page rendered server-side by ERB from openapi.yaml
    (operations, parameters, request body, responses, headers) with a link to a
    copy of openapi.yaml, ADR pages, Mermaid C4 diagrams, contract and SLO
    placeholders.
  - Tests are RSpec only. greeter-docs has no channel behaviour, so there is no
    Cucumber. Every OpenSpec scenario is verified by exactly one RSpec example
    tagged with its requirement and scenario slugs.
  - Sources are read-only. This repo never writes to, or opens PRs against,
    another repo.
  - Ruby 3.3.13, frozen_string_literal on every file, RuboCop clean. TDD: failing
    test committed before the implementation.

rules:
  proposal:
    - Include a "Non-goals" section.
    - Say which source ports and pages the change touches, and which repos'
      artifacts it newly depends on.
  specs:
    - Express build failures as WHEN/THEN scenarios that name what the error
      message must contain (repo, capability, requirement).
    - Domain requirements must be testable with in-memory sources only.
  design:
    - For a new source, include a fixture captured from the real tool's output
      (for example, a downloaded repo-trace artifact or ledger.json) and the
      tool version, run ID or commit it came from.
  tasks:
    - First task group is always "Red tests" (domain specs first, then adapter
      specs against fixtures, then a publisher snapshot spec).
    - Keep each task under two hours.
    - Last task group is "Verify and docs" (bin/fetch-sources, bin/build-docs,
      lychee link check, openspec validate).

operations:
  apply:
    guidance:
      - Never edit spec/ or spec/fixtures/ during apply; refresh fixtures only
        in a separate change.
      - Keep I/O out of lib/greeter_docs/domain/.
